version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"

  - package-ecosystem: terraform
    directories:
      - /environments/*
      - /modules/*
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      terraform:
        patterns: ["*"]
    commit-message:
      prefix: "deps"
