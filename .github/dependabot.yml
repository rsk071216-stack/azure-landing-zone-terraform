version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"

  - package-ecosystem: terraform
    directories:
      - /environments/*
      - /modules/*
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    ignore:
      # Provider major versions are planned migrations (state upgrades, renamed
      # arguments), not routine bumps. See the Roadmap in README.md.
      - dependency-name: "hashicorp/azurerm"
        update-types: ["version-update:semver-major"]
    groups:
      terraform:
        patterns: ["*"]
    commit-message:
      prefix: "deps"
