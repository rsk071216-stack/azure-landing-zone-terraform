# Manual plan/apply against a real subscription using GitHub OIDC (no client
# secrets). Apply runs only after a reviewer approves the GitHub environment.
#
# One-time setup: scripts/setup-oidc.sh, then add repository secrets
# AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID and create the
# GitHub environments "dev" and "prod" with required reviewers.
name: deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Landing zone to deploy
        type: choice
        options: [dev, prod]
        required: true
      action:
        description: plan only, or plan then apply (apply waits for approval)
        type: choice
        options: [plan, apply]
        default: plan

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TERRAFORM_VERSION: "1.15.9"
  WORKDIR: environments/${{ inputs.environment }}
  # azurerm provider + azurerm backend authenticate with the GitHub OIDC token.
  ARM_USE_OIDC: "true"
  ARM_USE_AZUREAD: "true"
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

jobs:
  plan:
    name: plan (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}-plan
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - name: terraform init
        run: terraform -chdir="$WORKDIR" init -backend-config=backend.hcl -lockfile=readonly
      - name: terraform plan
        run: |
          set -euo pipefail
          terraform -chdir="$WORKDIR" plan -out=tfplan -no-color | tee plan.txt
          {
            echo "### Plan: ${{ inputs.environment }}"
            echo '```'
            grep -E '^(Plan:|No changes)' plan.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tfplan-${{ inputs.environment }}-${{ github.run_id }}
          path: ${{ env.WORKDIR }}/tfplan
          retention-days: 5

  apply:
    name: apply (${{ inputs.environment }})
    if: inputs.action == 'apply'
    needs: plan
    runs-on: ubuntu-latest
    # Required reviewers on this GitHub environment are the approval gate.
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tfplan-${{ inputs.environment }}-${{ github.run_id }}
          path: ${{ env.WORKDIR }}
      - name: terraform init
        run: terraform -chdir="$WORKDIR" init -backend-config=backend.hcl -lockfile=readonly
      - name: terraform apply (exactly the reviewed plan)
        run: terraform -chdir="$WORKDIR" apply -no-color tfplan
